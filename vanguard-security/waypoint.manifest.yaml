# ──────────────────────────────────────────
# PHASES
# ──────────────────────────────────────────
phases:
  phase1:
    name: Foundation
    status: not_started
    github_milestone: ~
    description: Safety + OPSEC foundation — must ship before any other feature
    deliverables:
      - vanguardFetch (centralized HTTP egress, curl_cffi, OPSEC headers)
      - engagement.yaml schema + 15 preflight checks
      - trust_tier on graph nodes + provenance
      - Finding schema with quarantined_evidence field
      - Three-mode dispatcher (passive/validated/active)
      - Blast-radius decorator + 10MB evidence cap

  phase2:
    name: Brain Core
    status: not_started
    github_milestone: ~
    description: HPC-AG brain wired into workflow, 62 new chain patterns
    deliverables:
      - Planner agent wired between waves
      - Critic agent validates all findings
      - Chain Hunter runs between waves
      - chain-patterns.yaml 20 → 82 patterns
      - OPSEC-aware Critic (P_detection scoring)

  phase3:
    name: Intelligence Agents + Brain Core
    status: not_started
    github_milestone: ~
    description: Threat intel, credential feedback loop, black-box mode, brain agents
    deliverables:
      - threat-intel enhanced osint-recon (Wave 0, zero target contact)
      - cred-intel agent (default creds, HIBP, rate-limited spray)
      - hardening-auditor agent (headers, TLS, score A-F)
      - credential feedback loop (inter-agent secret passing)
      - black-box mode (no repo path required)
      - brain-planner, brain-critic, brain-chain-hunter, brain-guardian

  phase4:
    name: Advanced Surfaces
    status: not_started
    github_milestone: ~
    description: LLM attacks, per-cloud agents (AWS/GCP/Azure), browser-side, remediator, cross-engagement memory
    deliverables:
      - llm-prompt-injector, llm-exfiltrator, llm-rag-poisoner (LLM attack agents)
      - aws-vuln, gcp-vuln, azure-vuln (per-cloud replacing generic cloud-vuln)
      - browser-side agent (CSP bypass, postMessage, Service Worker, prototype pollution)
      - remediator (find → fix → re-test → open PR loop)
      - pgvector cross-engagement memory (anonymized finding signatures)

